name: Check MyKeep
on:
  push:
    branches: [karin/sidebar-images-heading-click]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false esbuild
      - run: node tests/pin-levels.mjs
