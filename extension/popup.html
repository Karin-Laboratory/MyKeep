<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyKeepに保存</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup">
    <header>
      <h1>MyKeepに保存</h1>
      <div class="open-note-slot">
        <button id="openNote" type="button" class="secondary" hidden>MyKeepで表示</button>
      </div>
      <button id="save" type="submit" form="captureForm" class="primary" disabled>保存</button>
    </header>
    <form id="captureForm">
      <label>タイトル<input id="title" type="text" maxlength="300" readonly /></label>
      <label>URL<input id="url" type="url" maxlength="2000" readonly /></label>
      <label>メモ<textarea id="body" rows="1" maxlength="100000" placeholder="任意のメモ"></textarea></label>
      <section class="labels-field" aria-labelledby="labelsHeading">
        <span id="labelsHeading" class="field-label">ラベル</span>
        <div class="label-picker">
          <button id="labelToggle" type="button" class="label-picker-toggle" aria-expanded="false" aria-controls="labelOptions" disabled>ラベルを選択</button>
          <div id="labelOptions" class="label-picker-menu" hidden></div>
        </div>
        <div id="selectedLabels" class="selected-labels" aria-live="polite"></div>
        <p id="labelStatus" class="label-status" role="status" aria-live="polite"></p>
      </section>
      <label>画像<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" /></label>
      <div id="pasteArea" tabindex="0">画像はここで Ctrl+V でも貼り付けできます</div>
      <div id="imagePreview" hidden>
        <img id="previewImage" alt="添付画像のプレビュー" />
        <span id="imageName"></span>
        <button id="removeImage" type="button" class="text-button">画像を外す</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </body>
</html>
